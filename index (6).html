<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nossas Contas — Pedro & Mirelli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--t1:#ff5d9e;--t2:#a46bff;--t3:#3d7bff;--acc:#ff5d9e;--bg1:#fff0f7;--bg2:#f3f0ff;--bg3:#eaf1ff;--m:#ff5d9e;--m2:#ffe3ef;--p:#3d7bff;--p2:#e0eaff;--ink:#2b2540;--mut:#8b86a3;--bg:#fbf7ff;--card:#fff;--ok:#1fb67a;--bad:#ff6b6b;--r:22px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 45%,var(--bg3) 100%) fixed;min-height:100vh;padding-bottom:96px}
button{font-family:inherit;cursor:pointer;border:0}
input,select{font-family:inherit;font-size:16px}
.wrap{max-width:720px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.brand{font-weight:900;font-size:22px;letter-spacing:-.3px}
.brand small{display:block;font-weight:600;font-size:12px;color:var(--mut)}
.couple{display:flex;align-items:center}
.couple .av{margin-left:-10px;border:3px solid #fff;box-shadow:0 4px 12px #0002}
.couple .av:first-child{margin-left:0}
.heart{margin:0 -4px;z-index:2;font-size:18px}
.av{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none;display:inline-block;background:#fff}
.av img,.av svg{width:100%;height:100%;object-fit:cover;display:block}
.av.cp{width:54px;height:54px;border:3px solid #fff;box-shadow:0 4px 14px #ff5d9e55}
.cpbig{width:100%;border-radius:22px;display:block;box-shadow:0 8px 24px #0002}
.av.sm{width:30px;height:30px}.av.lg{width:84px;height:84px;border:4px solid #fff;box-shadow:0 6px 18px #0002}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:0 8px 28px #5a3d9a14;margin-bottom:14px}
.hero{background:linear-gradient(135deg,var(--t1),var(--t2) 55%,var(--t3));color:#fff;position:relative;overflow:hidden}
.hero .big{font-size:34px;font-weight:900;letter-spacing:-1px;margin:6px 0 2px}
.hero .lbl{opacity:.85;font-weight:700;font-size:13px}
.hero .row{display:flex;align-items:center;gap:12px}
.hero .actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{padding:12px 16px;border-radius:14px;font-weight:800;font-size:15px;background:var(--ink);color:#fff}
.btn.light{background:#fff;color:var(--ink)}
.btn.ghost{background:#f1edfb;color:var(--ink)}
.btn.danger{background:#ffe6e6;color:#d33}
.btn.m,.btn.p{background:var(--acc)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:12px}
.monthnav{display:flex;align-items:center;justify-content:center;gap:12px;margin:2px 0 12px}
.monthnav b{min-width:160px;text-align:center;font-size:17px}
.monthnav button{width:38px;height:38px;border-radius:50%;background:#fff;font-size:18px;box-shadow:0 4px 12px #0001}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{padding:14px;border-radius:18px;background:#fff;box-shadow:0 8px 28px #5a3d9a14}
.stat .v{font-size:21px;font-weight:900}.stat .k{font-size:12px;color:var(--mut);font-weight:700;display:flex;align-items:center;gap:6px}
h3{margin:0 0 10px;font-size:16px}
.bar{height:10px;border-radius:99px;background:#f1edfb;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--t1),var(--t3))}
.catrow{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:14px;font-weight:700}
.catrow .n{width:120px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catrow .bar{flex:1}.catrow .val{width:84px;text-align:right;font-weight:800;font-size:13px}
.months{display:flex;align-items:flex-end;gap:8px;height:124px}
.months div{flex:1;text-align:center;font-size:11px;font-weight:800;color:var(--mut)}
.months i{display:block;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,var(--t1),var(--t3));margin-bottom:4px;min-height:4px}
.item{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #f1edfb}
.item:last-child{border:0}
.ico{width:42px;height:42px;border-radius:14px;background:#f5f1ff;display:grid;place-items:center;font-size:22px;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{color:var(--mut);font-weight:700}
.item .amt{text-align:right;font-weight:900;white-space:nowrap}
.chip{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:800;margin-top:2px}
.chip.m{background:var(--m2);color:#d6286f}.chip.p{background:var(--p2);color:#1f55d6}.chip.ok{background:#dcf8ec;color:#0f8a5a}
.empty{text-align:center;color:var(--mut);padding:26px 10px;font-weight:700}
.empty .e{font-size:38px;display:block}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#ffffffee;backdrop-filter:blur(10px);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px #5a3d9a18;z-index:20}
nav.tabs .in{display:flex;width:100%;max-width:720px;align-items:center}
nav.tabs button{flex:1;background:none;color:var(--mut);font-weight:800;font-size:11px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button span{font-size:21px}
nav.tabs button.on{color:var(--ink)}
nav.tabs button.on span{transform:translateY(-2px) scale(1.15)}
.fab{width:58px;height:58px;border-radius:50%!important;background:linear-gradient(135deg,var(--t1),var(--t3))!important;color:#fff!important;font-size:30px!important;flex:none!important;margin:-26px 6px 0;box-shadow:0 10px 24px #7a4dff55;display:grid!important;place-items:center}
.overlay{position:fixed;inset:0;background:#2b254088;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 12px;font-size:20px}
label.f{display:block;font-size:12px;font-weight:800;color:var(--mut);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.4px}
.in{width:100%;padding:13px 14px;border-radius:14px;border:2px solid #eee9fb;background:#fbf9ff;color:var(--ink);font-weight:700;outline:none}
.in:focus{border-color:#b9a4ff}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:9px 12px;border-radius:99px;background:#f5f1ff;font-weight:800;font-size:13px;color:var(--ink)}
.pill.on{background:var(--ink);color:#fff}
.who{display:flex;gap:10px}
.who button{flex:1;display:flex;align-items:center;gap:10px;padding:10px;border-radius:16px;background:#f5f1ff;font-weight:800;font-size:15px;border:3px solid transparent;color:var(--ink)}
.who button.on.m{border-color:var(--m);background:var(--m2)}.who button.on.p{border-color:var(--p);background:var(--p2)}
.preview{margin-top:12px;padding:12px;border-radius:14px;background:#f5f1ff;font-weight:800;font-size:14px;text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheetbtns{display:flex;gap:10px;margin-top:18px}.sheetbtns .btn{flex:1}
.goal{padding:14px 0;border-bottom:1px solid #f1edfb}.goal:last-child{border:0}
.goal .h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.goal .h b{flex:1}
.who-pick{text-align:center}
.who-pick .row{display:flex;gap:16px;justify-content:center;margin:18px 0}
.who-pick button{background:#f5f1ff;border-radius:22px;padding:16px 14px;font-weight:900;font-size:16px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:8px;width:46%}
.toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 16px;border-radius:14px;font-weight:800;z-index:60;box-shadow:0 10px 30px #0004;max-width:90vw;text-align:center}
.banner{padding:10px 14px;border-radius:14px;background:#fff6dc;color:#8a6200;font-weight:700;font-size:13px;margin-bottom:12px}
.cutebox{position:relative;overflow:hidden;padding:6px 0 0}.cgif{width:230px;height:230px;border-radius:28px;object-fit:cover;box-shadow:0 10px 28px #ff5d9e55;border:4px solid #fff}.kiss{display:flex;align-items:center;justify-content:center;gap:2px;margin-top:8px}.kl{animation:nudgeL 1.6s ease-in-out infinite alternate}.kr{animation:nudgeR 1.6s ease-in-out infinite alternate}.km{font-size:38px;animation:beat 1s ease-in-out infinite}
@keyframes nudgeL{to{transform:translateX(10px) rotate(4deg)}}@keyframes nudgeR{to{transform:translateX(-10px) rotate(-4deg)}}@keyframes beat{50%{transform:scale(1.35)}}
.fh{position:absolute;bottom:-20px;font-style:normal;font-size:20px;opacity:0;animation:floatup 3.2s ease-in infinite}@keyframes floatup{10%{opacity:.9}100%{transform:translateY(-260px);opacity:0}}
.pop{position:fixed;font-size:26px;pointer-events:none;z-index:70;animation:pop 1.4s ease-out forwards}
@keyframes pop{from{transform:translateY(0) scale(.6);opacity:1}to{transform:translateY(-220px) scale(1.4);opacity:0}}
.plancard{background:#fff;border-radius:22px;padding:16px;box-shadow:0 8px 28px #5a3d9a14;margin-bottom:14px}
.plancard .top{display:flex;align-items:center;gap:12px;cursor:pointer}
.plancard .em{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,#ffe3ef,#e0eaff);display:grid;place-items:center;font-size:28px;flex:none}
.plancard .nm{flex:1;min-width:0}.plancard .nm b{display:block;font-size:17px}.plancard .nm small{color:var(--mut);font-weight:700}
.faces{display:flex;align-items:center;gap:6px;margin:14px 0 4px}
.faces .arrow{flex:1;text-align:center;color:var(--mut);font-weight:800;font-size:12px}
.faces .arrow i{display:block;height:3px;border-radius:3px;background:repeating-linear-gradient(90deg,#c9bdf3 0 8px,transparent 8px 14px);margin:6px 0}
.faces .who1{text-align:center;font-size:11px;font-weight:800;color:var(--mut)}
.pstats{display:flex;justify-content:space-between;margin:12px 0 8px;font-weight:800;font-size:13px}
.pstats span b{display:block;font-size:17px;font-weight:900}
.pstats .r{text-align:right}
.insts{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px;margin-top:12px}
.inst{border-radius:14px;padding:8px 4px;text-align:center;background:#f5f1ff;color:var(--ink);position:relative;border:2px solid transparent;line-height:1.15}
.inst b{display:block;font-size:12px;text-transform:capitalize}.inst small{display:block;font-size:10px;font-weight:700;color:var(--mut)}.inst .n{font-size:10px;font-weight:800;color:var(--mut)}
.inst.paid{background:#dcf8ec;color:#0f7a52}.inst.paid small,.inst.paid .n{color:#3aa77b}
.inst.late{background:#ffe6e6;color:#c22}.inst.late small,.inst.late .n{color:#e55}
.inst.next{border-color:var(--m);background:#fff0f6}
.inst .ck{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;font-size:12px;display:grid;place-items:center}
.minisum{display:flex;align-items:center;gap:10px;padding:10px 0;font-weight:800;font-size:14px}.minisum .v{margin-left:auto;font-weight:900}
.sec{font-weight:900;font-size:15px;margin:18px 4px 8px;color:var(--ink)}
.alert{padding:12px 14px;border-radius:16px;background:#fff0e0;color:#a85a00;font-weight:800;font-size:14px;margin-bottom:14px;cursor:pointer;box-shadow:0 6px 18px #ff9a3a22}
.alert.rem small{font-weight:700;opacity:.85}.alert.rem .btn.light{background:#fff;color:inherit}
.searchbox{position:relative;margin-bottom:10px}.searchbox span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;pointer-events:none}.searchbox input{padding-left:40px}
.sweet{text-align:center;font-weight:900;font-size:13px;margin:-6px 0 12px;background:linear-gradient(90deg,var(--t1),var(--t2),var(--t3));-webkit-background-clip:text;background-clip:text;color:transparent}
.rcpt{border:2px dashed #d9d0f3;border-radius:16px;padding:10px;text-align:center}.rcpt img{max-width:100%;max-height:220px;border-radius:12px;display:block;margin:0 auto 8px}
.gcover{width:100%;height:190px;object-fit:cover;object-position:center 35%;border-radius:18px;margin-bottom:10px;display:block}
.fbig{font-size:26px;font-weight:900;letter-spacing:-.5px}.frow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f1edfb;font-weight:800}.frow:last-child{border:0}.mfaces{display:inline-flex;align-items:center;gap:6px}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
.mtile{background:#fff;border-radius:22px;padding:16px 14px;text-align:left;box-shadow:0 6px 18px #5a3d9a14;display:flex;flex-direction:column;gap:6px;font-weight:900;font-size:15px;color:var(--ink)}
.mtile .mi{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:24px;background:linear-gradient(135deg,var(--bg1),var(--bg3))}
.mtile small{font-weight:700;color:var(--mut);font-size:12px;line-height:1.3}
body.dark .mtile{background:#2a2142;box-shadow:none}
.mback{display:flex;align-items:center;gap:10px;margin-bottom:12px}.mback button{width:38px;height:38px;border-radius:50%;background:#fff;font-size:18px;font-weight:900;box-shadow:0 4px 12px #5a3d9a14}.mback b{font-size:18px}
body.dark .mback button{background:#2a2142;color:var(--ink);box-shadow:none}
.hero.slim .pc{padding:8px 4px}.hero.slim .pv{font-size:20px}.hero .tgl{display:block;margin:6px auto 0;background:rgba(255,255,255,.22);color:#fff;font-weight:800;font-size:12px;padding:6px 14px;border-radius:99px}
.donutw{display:flex;align-items:center;gap:14px}.donut{flex:none;width:132px;height:132px;position:relative}.donut b{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-size:12px;line-height:1.25;font-weight:900}
.dleg{flex:1;min-width:0}.dleg div{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;margin:5px 0}.dleg i{width:10px;height:10px;border-radius:50%;flex:none}.dleg span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dleg em{font-style:normal;color:var(--mut);font-weight:800}
.months .mv{font-size:10px;font-weight:900;color:var(--ink);margin-bottom:3px;white-space:nowrap}
.alert.bad{background:#ffe6e6;color:#c22}
.logi{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #f1edfb;font-size:13px;font-weight:700}
.logi:last-child{border:0}.logi small{display:block;color:var(--mut);font-weight:700}
textarea.in{resize:vertical;min-height:110px}
.av.xl{width:68px;height:68px}
.av.ring-m{box-shadow:0 0 0 3px var(--m)}.av.ring-p{box-shadow:0 0 0 3px var(--p)}
.hero .av{box-shadow:none!important;border:3px solid #fff}
.hfaces{display:flex;align-items:center;gap:8px;margin:14px 0 8px}
.hfaces .who1{text-align:center;font-size:12px;font-weight:800;color:#fff;min-width:74px;line-height:1.5}
.hfaces .arrow{flex:1;text-align:center;color:#fff;font-weight:900;font-size:13px}
.hfaces .arrow i{display:block;height:3px;border-radius:3px;margin:6px 0;background:repeating-linear-gradient(90deg,#fff 0 8px,transparent 8px 14px)}
.hfaces .arrow i::after{content:'▶';display:block;text-align:right;font-style:normal;font-size:11px;line-height:0;margin-top:-1px;margin-right:-4px}
.split{display:flex;height:16px;border-radius:99px;overflow:hidden;background:#f1edfb}
.split i{display:block;height:100%}.split i.m{background:var(--m)}.split i.p{background:var(--p)}
.splitl{display:flex;justify-content:space-between;margin-top:8px;font-weight:900;font-size:13px}
.seg{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;padding:10px 14px;border-radius:99px;background:#fff;font-weight:800;font-size:13px;color:var(--mut);box-shadow:0 4px 12px #5a3d9a14}
.seg button.on{background:var(--ink);color:#fff}
.whoswitch{display:flex;gap:8px;margin:-2px 0 14px}
.whoswitch button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 6px;border-radius:16px;background:#fff;font-weight:800;font-size:13px;color:var(--mut);border:3px solid transparent;box-shadow:0 4px 12px #5a3d9a14}
.whoswitch button.on{color:var(--ink)}
.whoswitch button.on.m{border-color:var(--m);background:var(--m2);color:#2b2540}
.whoswitch button.on.p{border-color:var(--p);background:var(--p2);color:#2b2540}
.whoswitch button.on:not(.m):not(.p){border-color:#a46bff;background:#efe6ff;color:#2b2540}
.pal{grid-template-columns:repeat(8,1fr)!important;gap:8px!important}.pal .pc{width:100%;aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px #0002;padding:0;min-width:0}.pal .pc.on{outline:3px solid var(--ink);outline-offset:1px}
.moon{margin-left:auto;margin-right:10px;width:40px;height:40px;border-radius:50%;background:#fff;font-size:18px;box-shadow:0 4px 12px #0001}
.brk{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:14px;margin-top:6px;color:#fff}
.brk.dim{opacity:.85;font-size:13px}
.dayh{font-size:12px;font-weight:900;color:var(--mut);text-transform:capitalize;margin:14px 2px 2px;letter-spacing:.3px}
.dayh:first-child{margin-top:0}
.selcat{flex:none;padding:9px 12px;border-radius:99px;border:0;background:#fff;font-family:inherit;font-weight:800;font-size:13px;color:var(--ink);box-shadow:0 4px 12px #5a3d9a14}
body.dark{--ink:#f1edff;--mut:#a59fc4;background:linear-gradient(160deg,#16111f 0%,#1b1530 50%,#101a33 100%) fixed}
body.dark .card:not(.hero),body.dark .stat,body.dark .plancard,body.dark .sheet{background:#211a33}
body.dark nav.tabs{background:#1b1530ee}
body.dark .in{background:#2a2142;border-color:#3a2f5c;color:var(--ink)}
body.dark .pill,body.dark .ico,body.dark .inst,body.dark .btn.ghost,body.dark .preview,body.dark .who button,body.dark .who-pick button{background:#2a2142;color:var(--ink)}
body.dark .pill.on{background:var(--m);color:#fff}
body.dark .bar,body.dark .split{background:#2a2142}
body.dark .item,body.dark .logi,body.dark .goal{border-color:#2f2650}
body.dark .monthnav button,body.dark .seg button,body.dark .moon,body.dark .whoswitch button,body.dark .selcat{background:#2a2142;color:var(--ink);box-shadow:none}
body.dark .seg button.on{background:var(--m);color:#fff}
body.dark .btn{background:#3a2f5c;color:#fff}
body.dark .btn.light{background:#fff;color:#2b2540}
body.dark .btn.m,body.dark .btn.p{background:var(--acc)}body.dark .btn.danger{background:#4a2020;color:#ff9a9a}
body.dark .inst.paid{background:#123d2e;color:#5fe0aa}body.dark .inst.late{background:#4a2020;color:#ff9a9a}body.dark .inst.next{background:#3a2040}
body.dark .alert{background:#3a2a14;color:#ffc27a}body.dark .alert.bad{background:#4a2020;color:#ff9a9a}
body.dark .who button.on.m{background:#4a2038}body.dark .who button.on.p{background:#1e2c52}
body.dark .whoswitch button.on.m{background:#4a2038;color:#fff}body.dark .whoswitch button.on.p{background:#1e2c52;color:#fff}body.dark .whoswitch button.on:not(.m):not(.p){background:#33265a;color:#fff}
body.dark .toast{background:#3a2f5c}
body.dark .banner{background:#3a2a14;color:#ffc27a}
body.dark .plancard .em{background:linear-gradient(135deg,#4a2038,#1e2c52)}
body.dark .chip.m{background:#4a2038;color:#ff8fbf}body.dark .chip.p{background:#1e2c52;color:#8fb3ff}body.dark .chip.ok{background:#123d2e;color:#5fe0aa}
.duo{display:flex;align-items:stretch;gap:8px;margin:12px 0 10px}
.duo .ht{align-self:center;font-size:22px;flex:none}
.pc{flex:1;min-width:0;background:rgba(255,255,255,.17);border-radius:22px;padding:12px 6px 12px;text-align:center;color:#fff}
.pc.me{background:rgba(255,255,255,.3);box-shadow:inset 0 0 0 2px #fff}
.pc .pn{font-weight:900;font-size:14px;margin:6px 0 2px}

function moodFor(w){
  if(!S.expenses.length)return 'neutral';
  var net=netOf(S.expenses);
  if(net===0)return 'happy';
  var creditor=net>0?'m':'p';
  return w===creditor?'ok':'think';
}
function av(w,cls,mood){if(mood==='love'&&!(AV[w]&&AV[w].love))mood='happy';var src=(AV[w]&&(AV[w][mood]||AV[w].neutral))||'';return '<span class="av '+(cls||'')+'"><img alt="'+NAMES[w]+'" src="'+src+'"></span>'}

/* ---------- money logic ---------- */
function shareM(e){return typeof e.pctM==='number'?e.pctM:50}
function netOf(list){ // >0: Pedro deve à Mirelli
  var n=0;
  list.forEach(function(e){
    if(e.type==='settlement'){n+=e.paidBy==='m'?e.amount:-e.amount;return}
    if((e.date||'')>todayISO())return; // parcelas futuras entram só quando vencem (veja o Resumo)
    var pm=shareM(e);
    if(e.paidBy==='m')n+=Math.round(e.amount*(100-pm)/100);
    else n-=Math.round(e.amount*pm/100);
  });
  return n;
}
function debtText(net){
  if(net>0)return NAMES.p+' deve '+brl(net)+' à '+NAMES.m;
  if(net<0)return NAMES.m+' deve '+brl(-net)+' ao '+NAMES.p;
  return 'Tudo certo entre vocês';
}
function expOnly(){return S.expenses.filter(function(e){return e.type!=='settlement'})}
function inMonth(list,k){return list.filter(function(e){return (e.date||'').slice(0,7)===k})}
function sortDesc(a,b){return (b.date||'').localeCompare(a.date||'')||(b.created||0)-(a.created||0)}

/* ---------- db ---------- */
function col(n){return db.collection(n)}
function save(c,id,obj){return col(c).doc(id).set(clean(obj)).catch(function(e){toast('Não consegui salvar 😕');console.error(e)})}
function del(c,id){return col(c).doc(id).delete().catch(function(e){toast('Não consegui apagar');console.error(e)})}
function sub(name,key,after){
  try{col(name).onSnapshot(function(snap){
    var rows=rowsOf(snap);
    if(name==='members'){S.membersReady=true;var m={};rows.forEach(function(r){m[r.id]=r.who});S.members=m}
    else if(name==='config'){rows.forEach(function(r){if(r.id==='avatars')S.avatars={m:r.m,p:r.p};if(S.uid&&r.id==='theme-'+S.uid&&r.t&&Date.now()>themeLocalUntil){try{var th=JSON.parse(r.t);if(JSON.stringify(th)!==JSON.stringify(CUR_THEME))applyTheme(th,true)}catch(e){}}})}
    else S[key]=rows;
    S.ready=true;resolveMe();render();
  },function(err){console.error(err);S.dbOk=false;render()})}catch(e){console.error(e);S.dbOk=false}
}
function resolveMe(){if(S.uid&&S.members[S.uid])S.me=S.members[S.uid]}

/* ---------- views ---------- */
function render(){
  if(!S.ready&&S.dbOk){document.getElementById('app').innerHTML='<div class="empty"><img class="av lg" style="margin:0 auto 8px" alt="" src="'+COUPLE.s+'"><br>Carregando as contas de vocês…</div>';renderTabs();return}
  var app=document.getElementById('app');
  var head='<header class="top"><div class="brand">Nossas Contas<small>'+esc(NAMES.p)+' &amp; '+esc(NAMES.m)+'</small></div><button class="moon" data-act="theme" aria-label="Aparência">🎨</button><div class="couple" data-act="avatars"><span class="av cp"><img alt="Pedro e Mirelli" src="'+COUPLE.s+'"></span></div></header>'+whoSwitch();

function pad2(n){return String(n).padStart(2,'0')}
function daysIn(k){var p=k.split('-');return new Date(+p[0],+p[1],0).getDate()}
function instAmt(p,i){var base=Math.floor(p.total/p.n),rem=p.total-base*p.n;return base+(i===1?rem:0)}
function instMonth(p,i){return addMonths(p.first,i-1)}
function instDate(p,i){var m=instMonth(p,i);return m+'-'+pad2(Math.min(p.day||10,daysIn(m)))}
function planStats(p){
  var paid=p.paid||{},today=todayISO(),st={paidN:0,paidAmt:0,restAmt:0,late:0,next:0,list:[]};
  for(var i=1;i<=p.n;i++){
    var a=instAmt(p,i),d=instDate(p,i),k=paid[i]?'paid':(d<today?'late':'future');
    st.list.push({i:i,a:a,d:d,k:k,pd:paid[i]});
    if(k==='paid'){st.paidN++;st.paidAmt+=a}else{st.restAmt+=a;if(k==='late')st.late++}
  }
  for(var j=0;j<st.list.length;j++){if(st.list[j].k!=='paid'){st.next=st.list[j].i;break}}
  st.done=st.paidN===p.n;return st;
}
function planMoods(p,st){
  var debtor=other(p.payer),cred=p.payer;
  if(st.done)return {d:'happy',c:'love'};
  if(st.late)return {d:debtor==='m'?'think':'sad',c:'shock'};
  return {d:st.paidN?'ok':'neutral',c:'ok'};
}

function dueReminders(){
  var today=todayISO(),lim=new Date();lim.setDate(lim.getDate()+3);var limISO=lim.getFullYear()+'-'+pad2(lim.getMonth()+1)+'-'+pad2(lim.getDate());
  var g={};
  S.plans.forEach(function(p){
    var st=planStats(p);
    st.list.forEach(function(x){
      if(x.k==='paid'||x.d<today||x.d>limISO)return;
      var c=p.payer,gr=g[c]=g[c]||{cred:c,deb:other(c),amt:0,d:x.d,items:[],card:null};
      gr.amt+=x.a;if(x.d<gr.d)gr.d=x.d;gr.items.push(p.item+' '+x.i+'/'+p.n);
      var cd=p.cardId?S.cards.find(function(k){return k.id===p.cardId}):null;if(cd)gr.card=cd.name;
    });
  });
  var net=netOf(S.expenses),out=[];
  Object.keys(g).forEach(function(c){
    var gr=g[c],split=0;
    if((net>0&&gr.deb==='p'&&gr.cred==='m')||(net<0&&gr.deb==='m'&&gr.cred==='p'))split=Math.abs(net);
    gr.split=split;gr.total=gr.amt+split;out.push(gr);
  });
  if(S.view==='me'&&S.me)out=out.filter(function(r){return r.deb===S.me||r.cred===S.me});
  return out;
}

  if((el=t.closest('[data-rsum]'))){resumoSheet(el.dataset.rsw,el.dataset.rsum);return}
  if((el=t.closest('[data-rs]'))){S.rs=el.dataset.rs;render();return}
  if((el=t.closest('[data-go]'))){S.tab='more';S.more=el.dataset.go;S.rs=null;if(el.dataset.month)S.month=el.dataset.month;render();return}
  if((el=t.closest('[data-more]'))){S.more=el.dataset.more;render();return}
  if((el=t.closest('[data-ptoggle]'))){var pk=el.dataset.ptoggle;S.openPlans[pk]=!S.openPlans[pk];render();return}
  if((el=t.closest('[data-me]'))){S.me=el.dataset.me;S.members[S.uid]=S.me;save('members',S.uid,{who:S.me});closeSheet();render();toast('Oi, '+NAMES[S.me]+'! 💞');return}
  if(t.closest('[data-close]')){closeSheet();return}
  if((el=t.closest('[data-pix]'))){var pw=el.dataset.pix;try{navigator.clipboard.writeText(PIX[pw]).then(function(){toast('Pix '+(pw==='p'?'do ':'da ')+NAMES[pw]+' copiado!')},function(){fallbackCopy(PIX[pw])})}catch(e){fallbackCopy(PIX[pw])}return}
  if((el=t.closest('[data-paym]'))&&F){F.pay=el.dataset.paym;var ov0=el.closest('.overlay');if(F.pay==='card'&&!F.cardId&&S.cards.length===1)F.cardId=S.cards[0].id;paintForm(ov0);autoDue(ov0);return}
  if((el=t.closest('[data-xcard]'))&&F){F.cardId=el.dataset.xcard||null;F.dueTouched=false;var ov1=el.closest('.overlay');paintForm(ov1);autoDue(ov1);return}
  if((el=t.closest('[data-cat]'))&&F){F.cat=el.dataset.cat;paintForm(el.closest('.overlay'));return}
  if((el=t.closest('[data-mode]'))&&F){F.mode=el.dataset.mode;paintForm(el.closest('.overlay'));return}
  if((el=t.closest('[data-w]'))&&el.closest('#fwho')){F.paidBy=el.dataset.w;paintForm(el.closest('.overlay'));return}
  if((el=t.closest('[data-del]'))){askDeleteExpense(el.dataset.del);return}
  if((el=t.closest('[data-delone]'))){var d1=S.expenses.find(function(x){return x.id===el.dataset.delone});delReceipt([d1]);del('expenses',el.dataset.delone);logAct('apagou a parcela '+(d1?d1.desc:''));closeSheet();toast('Apagado');return}
  if((el=t.closest('[data-delgrp]'))){var g=el.dataset.delgrp,ls=S.expenses.filter(function(x){return x.grp===g});delReceipt(ls);ls.forEach(function(x){del('expenses',x.id)});logAct('apagou o gasto parcelado '+(ls[0]?ls[0].desc.replace(/ \(\d+\/\d+\)$/,''):'')+' ('+ls.length+' parcelas)');closeSheet();toast('Apagado');return}
  if(t.closest('[data-confirm]')){var f=CONF;CONF=null;closeSheet();if(f)f();return}
  if((el=t.closest('[data-rdel]'))){var rid=el.dataset.rdel,rr=S.recs.find(function(x){return x.id===rid});confirmDel('Apagar o gasto fixo "'+(rr?rr.desc:'')+'"? Os lançamentos já feitos continuam.',function(){del('recurring',rid);logAct('apagou o fixo '+(rr?rr.desc:''))});return}
  if((el=t.closest('[data-gdel]'))){var gid2=el.dataset.gdel,gg=S.goals.find(function(x){return x.id===gid2});confirmDel('Apagar a meta "'+(gg?gg.name:'')+'" e tudo que já foi guardado nela?',function(){del('goals',gid2);logAct('apagou a meta '+(gg?gg.name:''))});return}
  if((el=t.closest('[data-edit]'))){var e=S.expenses.find(function(x){return x.id===el.dataset.edit});if(e){if(e.type==='settlement'){openSheet('<h2>Acerto de '+brl(e.amount)+'</h2><div style="font-weight:700;color:var(--mut)">'+NAMES[e.paidBy]+' pagou '+NAMES[other(e.paidBy)]+' em '+dateBR(e.date)+'</div><div class="sheetbtns"><button class="btn danger" data-del="'+esc(e.id)+'">Apagar acerto</button><button class="btn ghost" data-close>Fechar</button></div>')}else expenseSheet(e)}return}
  if((el=t.closest('[data-inst]'))){var q=el.dataset.inst.split(':');instSheet(q[0],+q[1]);return}
  if((el=t.closest('[data-pay]'))){var q2=el.dataset.pay.split(':');var dv=document.getElementById('idate');setPaid(q2[0],+q2[1],(dv&&dv.value)||todayISO());return}
  if((el=t.closest('[data-unpay]'))){var q3=el.dataset.unpay.split(':');setPaid(q3[0],+q3[1],null);return}
  if((el=t.closest('[data-remind]'))){var q4=el.dataset.remind.split(':');remindMsg(q4[0],+q4[1]);return}
  if((el=t.closest('[data-pedit]'))){planSheet(S.plans.find(function(x){return x.id===el.dataset.pedit}));return}
  if((el=t.closest('[data-cedit]'))){cardSheet(S.cards.find(function(x){return x.id===el.dataset.cedit}));return}
  if((el=t.closest('[data-cdel]'))){var cdid=el.dataset.cdel,cx=S.cards.find(function(x){return x.id===cdid});confirmDel('Apagar o cartão "'+(cx?cx.name:'')+'"? Os parcelados continuam, só perdem a ligação com ele.',function(){del('cards',cdid);logAct('apagou o cartão '+(cx?cx.name:''))});return}
  if((el=t.closest('[data-pdel]'))){var pid2=el.dataset.pdel,pp=S.plans.find(function(x){return x.id===pid2});confirmDel('Apagar o parcelado "'+(pp?pp.item:'')+'" com todas as parcelas e pagamentos marcados?',function(){del('plans',pid2);logAct('apagou o parcelado '+(pp?pp.item:''))});return}
  if((el=t.closest('[data-launch]'))){launchRec(el.dataset.launch);return}
  if((el=t.closest('[data-redit]'))){recSheet(S.recs.find(function(x){return x.id===el.dataset.redit}));return}
  if((el=t.closest('[data-gedit]'))){goalSheet(S.goals.find(function(x){return x.id===el.dataset.gedit}));return}
  if((el=t.closest('[data-gadd]'))){goalAddSheet(el.dataset.gadd);return}
  if((el=t.closest('[data-act]'))){
    var a=el.dataset.act;
    if(a==='new')expenseSheet(null);
    else if(a==='prev'){S.month=addMonths(S.month,-1);render()}
    else if(a==='next'){S.month=addMonths(S.month,1);render()}
    else if(a==='settleNow')settleSheet();
    else if(a==='copyCharge')chargeMsg();
    else if(a==='newRec')recSheet(null);
    else if(a==='newPlan')planSheet(null);
    else if(a==='newCard')cardSheet(null);
    else if(a==='dark'){DARK=!DARK;document.body.classList.toggle('dark',DARK);try{localStorage.setItem('nc_dark',DARK?'1':'0')}catch(e){}render();if(document.querySelector('.overlay[data-theme-sheet]'))themeSheet()}
    else if(a==='theme')themeSheet();
    else if(a==='logout'){if(window.NC_LOGOUT)window.NC_LOGOUT()}
    else if(a==='herotgl'){HEROOPEN=!HEROOPEN;try{localStorage.setItem('nc_hero',HEROOPEN?'1':'0')}catch(e){}render()}
    else if(a==='cute')cuteMoment('bills');
    else if(a==='dlcsv')doDownload('nossas-contas-'+todayISO()+'.csv',buildCSV(),'text/csv;charset=utf-8');
    else if(a==='dljson')doDownload('nossas-contas-backup-'+todayISO()+'.json',buildBackup(),'application/json');
    else if(a==='cpjson')copy(buildBackup());
    else if(a==='restore')restoreSheet();
    else if(a==='newGoal')goalSheet(null);
    else if(a==='avatars')avatarSheet();
    else if(a==='switchme'){closeSheet();S.me=null;delete S.members[S.uid];del('members',S.uid);render()}
  }
});

function onColor(ev){if(ev.target&&ev.target.id==='tcolor'&&/^#[0-9a-f]{6}$/i.test(ev.target.value))applyTheme(customTheme(ev.target.value))}
document.addEventListener('input',onColor);document.addEventListener('change',onColor);
document.addEventListener('input',function(ev){if(ev.target&&ev.target.id==='lq'){S.q=ev.target.value;var r=document.getElementById('lres');if(r)r.innerHTML=listResults()}});
document.addEventListener('change',function(ev){if(ev.target&&ev.target.id==='lcat'){S.lc=ev.target.value;render()}});
window.addEventListener('error',function(ev){try{toast('⚠️ Erro: '+String(ev.message||'desconhecido').slice(0,90))}catch(e){}});
window.addEventListener('unhandledrejection',function(ev){try{var m=ev.reason&&(ev.reason.message||ev.reason);toast('⚠️ Erro: '+String(m||'desconhecido').slice(0,90))}catch(e){}});
/* ---------- boot ---------- */
render();
var guard=setTimeout(function(){if(!S.ready){S.ready=true;S.dbOk=!!db;render()}},3600000);
(async function(){
  try{user=await claude.use('user');if(user&&user.id)S.uid=await user.id()}catch(e){}
  try{db=await claude.use('db')}catch(e){db=null}
  if(!db){S.dbOk=false;S.ready=true;clearTimeout(guard);render();return}
  if(!S.uid)S.uid='anon-'+uid8();
  sub('expenses','expenses');sub('recurring','recs');sub('goals','goals');sub('plans','plans');sub('cards','cards');sub('log','log');sub('members','members');sub('config','config');
  // garante que a tela libera mesmo com banco vazio
  setTimeout(function(){S.membersReady=true;if(!S.ready)S.ready=true;render()},2500);
})();
})();
</script>
</body>
</html>
